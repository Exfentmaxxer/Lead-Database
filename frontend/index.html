<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lead DB">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Standard Meta Tags -->
  <meta name="description" content="NFPA-96 Lead & Inspection Database">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/icon-192.png">

  <title>Lead Database</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Status Bar Spacer for iOS -->
  <div class="status-bar-spacer"></div>

  <!-- App Container -->
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <h1>📋 Lead Database</h1>
      <div class="connection-status" id="connectionStatus">
        <span class="status-indicator" id="statusIndicator"></span>
        <span class="status-text" id="statusText">Checking...</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">

      <!-- Tab Navigation -->
      <div class="tab-navigation">
        <button class="tab-button active" data-tab="form" id="formTab">
          ➕ New Lead
        </button>
        <button class="tab-button" data-tab="records" id="recordsTab">
          📊 Records
        </button>
      </div>

      <!-- Form Tab -->
      <div class="tab-content active" id="formContent">

        <!-- Alert Messages -->
        <div class="alert" id="alert" style="display: none;">
          <span id="alertMessage"></span>
          <button class="alert-close" id="alertClose">&times;</button>
        </div>

        <!-- Lead Form -->
        <form id="leadForm" class="lead-form" novalidate>

          <!-- Business Information -->
          <div class="form-section">
            <h2 class="section-title">Business Information</h2>

            <div class="form-group">
              <label for="businessName" class="required">Business Name</label>
              <input
                type="text"
                id="businessName"
                name="business_name"
                required
                autocomplete="organization"
                placeholder="Enter business name">
              <span class="error-message" id="businessNameError"></span>
            </div>

            <div class="form-group">
              <label for="address" class="required">Address</label>
              <input
                type="text"
                id="address"
                name="address"
                required
                autocomplete="street-address"
                placeholder="Enter full address">
              <span class="error-message" id="addressError"></span>
            </div>
          </div>

          <!-- Contact Information -->
          <div class="form-section">
            <h2 class="section-title">Contact Information</h2>

            <div class="form-group">
              <label for="contactName">Contact Name</label>
              <input
                type="text"
                id="contactName"
                name="contact_name"
                autocomplete="name"
                placeholder="Enter contact name">
            </div>

            <div class="form-group">
              <label for="phone">Phone</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
                placeholder="(555) 123-4567">
              <span class="error-message" id="phoneError"></span>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="contact@example.com">
              <span class="error-message" id="emailError"></span>
            </div>
          </div>

          <!-- Service Details -->
          <div class="form-section">
            <h2 class="section-title">Service Details</h2>

            <div class="form-group">
              <label for="hoodType">Hood Type</label>
              <select id="hoodType" name="hood_type">
                <option value="">Select hood type</option>
                <option value="Type I - Grease">Type I - Grease</option>
                <option value="Type II - Heat/Steam">Type II - Heat/Steam</option>
                <option value="Type I & II Combined">Type I & II Combined</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="serviceFrequency">Service Frequency</label>
              <select id="serviceFrequency" name="service_frequency">
                <option value="">Select frequency</option>
                <option value="Monthly">Monthly</option>
                <option value="Quarterly">Quarterly</option>
                <option value="Semi-Annual">Semi-Annual</option>
                <option value="Annual">Annual</option>
                <option value="As Needed">As Needed</option>
              </select>
            </div>
          </div>

          <!-- Inspection Details -->
          <div class="form-section">
            <h2 class="section-title">Inspection Details</h2>

            <div class="form-group">
              <label for="nfpaDeficiencies">NFPA-96 Deficiencies</label>
              <textarea
                id="nfpaDeficiencies"
                name="nfpa_deficiencies"
                rows="4"
                placeholder="List any NFPA-96 deficiencies found..."></textarea>
            </div>

            <div class="form-group">
              <label for="pricingNotes">Pricing Notes</label>
              <textarea
                id="pricingNotes"
                name="pricing_notes"
                rows="3"
                placeholder="Enter pricing information..."></textarea>
            </div>

            <div class="form-group">
              <label for="generalNotes">General Notes</label>
              <textarea
                id="generalNotes"
                name="general_notes"
                rows="4"
                placeholder="Additional notes..."></textarea>
            </div>

            <div class="form-group checkbox-group">
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  id="followUpRequired"
                  name="follow_up_required">
                <span class="checkbox-custom"></span>
                <span class="checkbox-text">Follow-up Required</span>
              </label>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span id="submitBtnText">💾 Save Lead</span>
              <span id="submitBtnLoader" class="btn-loader" style="display: none;">⏳</span>
            </button>
            <button type="button" class="btn btn-secondary" id="resetBtn">
              🔄 Clear Form
            </button>
          </div>

        </form>
      </div>

      <!-- Records Tab -->
      <div class="tab-content" id="recordsContent">

        <!-- Search Bar -->
        <div class="search-bar">
          <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search leads..."
            class="search-input">
        </div>

        <!-- Records List -->
        <div class="records-container">
          <div id="recordsList" class="records-list">
            <!-- Records will be dynamically loaded here -->
            <div class="loading">Loading records...</div>
          </div>
        </div>

        <!-- Record Detail Modal -->
        <div class="modal" id="recordModal" style="display: none;">
          <div class="modal-content">
            <div class="modal-header">
              <h2 id="modalTitle">Record Details</h2>
              <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
              <!-- Record details will be loaded here -->
            </div>
          </div>
        </div>

      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>NFPA-96 Lead Database v1.0</p>
    </footer>

  </div>

  <!-- Install Prompt -->
  <div class="install-prompt" id="installPrompt" style="display: none;">
    <div class="install-content">
      <span class="install-icon">📱</span>
      <div class="install-text">
        <strong>Install App</strong>
        <small>Add to home screen for quick access</small>
      </div>
      <button class="btn-install" id="installBtn">Install</button>
      <button class="btn-dismiss" id="dismissInstall">&times;</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/app.js"></script>
</body>
</html>
